name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[cad,dev]"
      - name: Lint
        run: ruff check cadpipe tests
      - name: Test
        run: pytest -q
      - name: Smoke build
        run: |
          python -m cadpipe build --config configs/smoke.yaml
          cat data_smoke/report.md
