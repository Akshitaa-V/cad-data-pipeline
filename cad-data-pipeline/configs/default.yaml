# Full dataset build. Same config + same seed = same dataset.
out_dir: data
seed: 42
parts_per_family: 100
families: [plate_with_holes, l_bracket, flanged_shaft, stepped_block]

# Representations
n_points: 2048          # surface samples per part (with normals)
voxel_resolution: 32    # occupancy grid side length

# Tessellation of the STL export
stl_tolerance: 0.01     # mm
angular_tolerance: 0.1  # rad

# Faults injected on purpose, so the validators are tested on known errors
duplicate_fraction: 0.05
fault_fraction: 0.05

# Validation
volume_rel_tol: 0.01    # mesh volume must be within 1 % of the B-Rep volume

split: [0.8, 0.1, 0.1]
workers: 4
